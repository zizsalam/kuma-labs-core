<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG · Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #F2EBDF;
    color: #1A1A1A;
    font-family: 'Instrument Serif', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    width: 1200px;
    height: 630px;
    padding: 50px 72px;
    position: relative;
    overflow: hidden;
  }
  .bottom {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 90px;
  }
  .frame::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(26,26,26,0.07) 0.8px, transparent 0.8px);
    background-size: 18px 18px;
    pointer-events: none;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    position: relative;
    z-index: 1;
  }
  .logo {
    font-family: 'Instrument Serif', serif;
    font-size: 30px;
    letter-spacing: -0.015em;
    color: #1A1A1A;
  }
  .logo em { color: #1D9E75; font-style: italic; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #1D9E75;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .label::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 1px;
    background: #1D9E75;
  }
  .body {
    position: relative;
    z-index: 1;
    margin-top: -10px;
  }
  .eyebrow {
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 80px;
    line-height: 1.0;
    letter-spacing: -0.025em;
    color: #1A1A1A;
    max-width: 16ch;
  }
  h1 em { color: #1D9E75; font-style: italic; }
  .kicker {
    margin-top: 24px;
    font-family: 'Instrument Serif', serif;
    font-size: 26px;
    line-height: 1.4;
    color: rgba(26,26,26,0.62);
    max-width: 720px;
  }
  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    z-index: 1;
    border-top: 1px solid rgba(26,26,26,0.18);
    padding-top: 22px;
    gap: 24px;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: rgba(26,26,26,0.62);
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #1A1A1A;
    text-transform: uppercase;
  }
  .meta-item { display: inline-block; }
  .meta-item + .meta-item { margin-left: 18px; padding-left: 18px; border-left: 1px solid rgba(26,26,26,0.18); }
  /* Decorative bar chart on right */
  .chart {
    position: absolute;
    right: 80px;
    top: 80px;
    width: 220px;
    height: 100px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    z-index: 1;
    opacity: 0.5;
  }
  .chart .bar {
    flex: 1;
    background: rgba(26,26,26,0.55);
    border-radius: 1px;
  }
  .chart .bar.green { background: #1D9E75; }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <span class="logo">Kuma <em>Labs</em></span>
    <span class="label">Research Report</span>
  </div>

  <div class="chart">
    <div class="bar" style="height:22%"></div>
    <div class="bar" style="height:18%"></div>
    <div class="bar" style="height:24%"></div>
    <div class="bar" style="height:20%"></div>
    <div class="bar" style="height:27%"></div>
    <div class="bar green" style="height:43%"></div>
    <div class="bar" style="height:30%"></div>
    <div class="bar" style="height:25%"></div>
    <div class="bar" style="height:33%"></div>
    <div class="bar" style="height:28%"></div>
  </div>

  <div class="body">
    <h1>The State of <em>Wolof Voice AI</em>.</h1>
    <p class="kicker">Benchmarks, failure modes, and the gap to production. Six commercial systems measured against 104 Senegalese voice samples.</p>
  </div>

  <div class="bottom">
    <div class="bottom-row">
      <span class="url">kuma-labs.com/research/state-of-wolof-voice-ai-2026</span>
      <span class="meta">
        <span class="meta-item">104 SAMPLES</span>
        <span class="meta-item">6 SYSTEMS</span>
        <span class="meta-item">622 CALLS</span>
      </span>
    </div>
  </div>
</div>
</body>
</html>
